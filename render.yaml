services:
  - type: web
    name: shapediver-app-builder
    runtime: static
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    branch: development
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_SHAPEDIVER_ENDPOINT
        fromGroup: shapediver-config
      - key: VITE_DESIGN_TICKET
        fromGroup: shapediver-config
      - key: VITE_VIEWER_TICKET
        fromGroup: shapediver-config
      - key: SENTRY_AUTH_TOKEN
        fromGroup: monitoring
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /example.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*.mjs
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /example.html
